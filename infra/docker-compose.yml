version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zyra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zyra_db}
      POSTGRES_USER: ${POSTGRES_USER:-zyra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zyra_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zyra_user} -d ${POSTGRES_DB:-zyra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zyra-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zyra-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - zyra-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: zyra-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zyra_user}:${POSTGRES_PASSWORD:-zyra_password}@postgres:5432/${POSTGRES_DB:-zyra_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zyra-network
    restart: unless-stopped
    command: npm run dev

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: zyra-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - zyra-network
    restart: unless-stopped
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  zyra-network:
    driver: bridge

