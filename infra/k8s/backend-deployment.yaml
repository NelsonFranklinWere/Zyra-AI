apiVersion: apps/v1
kind: Deployment
metadata:
  name: zyra-backend
  namespace: zyra
  labels:
    app: zyra-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zyra-backend
  template:
    metadata:
      labels:
        app: zyra-backend
    spec:
      containers:
      - name: backend
        image: zyra/backend:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zyra-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: zyra-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: zyra-secrets
              key: jwt-secret
        - name: WA_API_KEY
          valueFrom:
            secretKeyRef:
              name: zyra-secrets
              key: wa-api-key
        - name: MPESA_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: zyra-secrets
              key: mpesa-consumer-key
        - name: MPESA_CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: zyra-secrets
              key: mpesa-consumer-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zyra-backend
  namespace: zyra
spec:
  selector:
    app: zyra-backend
  ports:
  - port: 80
    targetPort: 3001
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zyra-backend-hpa
  namespace: zyra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zyra-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

