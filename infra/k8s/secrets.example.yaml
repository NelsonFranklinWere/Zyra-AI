# Example secrets template - DO NOT COMMIT REAL SECRETS
# Use: kubectl create secret generic zyra-secrets --from-literal=key=value
# Or: kubectl apply -f secrets.yaml (after replacing values)

apiVersion: v1
kind: Secret
metadata:
  name: zyra-secrets
  namespace: zyra
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/zyra_db"
  redis-url: "redis://redis:6379"
  jwt-secret: "change-me-to-random-32-char-string"
  wa-api-key: "your-whatsapp-api-key"
  mpesa-consumer-key: "your-mpesa-consumer-key"
  mpesa-consumer-secret: "your-mpesa-consumer-secret"
  postgres-user: "zyra_user"
  postgres-password: "change-me"

